services:
  postgres:
    image: postgres:15-alpine
    container_name: adoptme_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-adoptme_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el archivo .env}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
