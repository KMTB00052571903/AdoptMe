services:
  postgres:
    image: postgres:15-alpine
    container_name: adoptme_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-adoptme_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el archivo .env}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Docker revisa que Postgres ya acepte conexiones antes de arrancar el backend.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-adoptme_db}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: adoptme_backend
    restart: unless-stopped
    # Toma las variables del .env de la raíz (PORT, DB_USER, DB_PASSWORD...).
    env_file: .env
    environment:
      # Dentro de Docker, la base no está en "localhost" sino en el
      # servicio "postgres" de este mismo archivo.
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: